services:
  - type: web
    name: dailydrop-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_MODE
        value: development
